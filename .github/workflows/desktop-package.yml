name: Desktop Package

on:
  push:
    branches:
      - safe-publish-v0
  workflow_dispatch:

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build desktop package
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\package-desktop-win.ps1

      - name: Upload desktop ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Social-Publisher-Desktop
          path: dist/Social-Publisher-Desktop.zip
          if-no-files-found: error
          retention-days: 30
